<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulir Interaktif</title>
</head>
<body>
    <h1>Formulir Interaktif - P5_057</h1>
    <form id="myForm">
        <label for="userInput">Masukkan Nama:</label>
        <input type="text" id="userInput" placeholder="Masukkan nama anda" name="userInput">
        <button type="submit">Kirim</button>
    </form>
    <p id="message"></p>
    <script>
        document.addEventListener('DOMContentLoaded',()=>{
            const form = document.getElementById ('myForm');
            const message = document.getElementById('message');

            form.addEventListener('submit', (event) => {
                event.preventDefault();
                const userInput = document.getElementById('userInput');
                if (userInput.value.trim()) {
                    message.textContent = `Terimakasih, ${userInput.value.trim()}! Formulir telah dikirim.`;
                }
                else {
                    message.textContent = 'Silakan masukkan nama!';
                }
            });
        });
    </script>
</body>
</html>
